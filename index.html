/* =====================================================================
   INDEXEDDB: copia espejo diaria (últimos 7 días)
   ===================================================================== */
const idb = {
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('sin IndexedDB'));
      const r = indexedDB.open('minutriapp-db', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('snapshots', { keyPath: 'date' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async put(snap) {
    const db = await this.open();
    await new Promise((res, rej) => { const tx = db.transaction('snapshots', 'readwrite'); tx.objectStore('snapshots').put(snap); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    const all = await this.all(db);
    const extra = all.sort((a, b) => b.date.localeCompare(a.date)).slice(7);
    if (extra.length) await new Promise((res) => { const tx = db.transaction('snapshots', 'readwrite'); extra.forEach((e) => tx.objectStore('snapshots').delete(e.date)); tx.oncomplete = res; tx.onerror = res; });
    db.close();
  },
  async all(dbIn) {
    const db = dbIn || (await this.open());
    const rows = await new Promise((res, rej) => { const q = db.transaction('snapshots').objectStore('snapshots').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    if (!dbIn) db.close();
    return rows;
  }
};

async function exportBackup(state) {
  const payload = { app: 'MiNutriApp', version: 1, exportedAt: new Date().toISOString(), data: state };
  const json = JSON.stringify(payload, null, 2);
  const name = `minutriapp-respaldo-${dateKey()}.json`;
  if (navigator.share && navigator.canShare) {
    for (const type of ['application/json', 'text/plain']) {
      let file;
      try { file = new File([json], name, { type }); } catch (e) { break; }
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Respaldo MiNutriApp', text: `Respaldo MiNutriApp ${dateKey()}` });
          return 'shared';
        } catch (e) {
          if (e && e.name === 'AbortError') return 'cancelled';
          break; // cualquier otro error: caer a descarga
        }
      }
    }
  }
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  return 'downloaded';
}
function parseBackup(text) {
  const obj = JSON.parse(text);
  const data = obj && obj.app === 'MiNutriApp' ? obj.data : obj;
  if (!data || typeof data !== 'object' || !data.profile) throw new Error('Archivo no válido');
  const s = normalize(data);
  s.meta.isSample = false;
  s.meta.lastBackup = obj.exportedAt ? new Date(obj.exportedAt).getTime() : Date.now();
  return s;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fallback */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
const sinceText = (ts) => {
  if (!ts) return 'nunca';
  const h = (Date.now() - ts) / 36e5;
  if (h < 1) return 'hace menos de 1 hora';
  if (h < 24) return `hace ${Math.floor(h)} h`;
  const d = Math.floor(h / 24);
  return `hace ${d} ${d === 1 ? 'día' : 'días'}`;
};

/* =====================================================================
   NAVEGACIÓN MÓVIL: botón "Atrás" (History API)
   Cada ventana abierta (NutriBot, Tour, modales) y cada pestaña distinta de
   Porciones ocupa una entrada del historial. "Atrás" cierra primero la ventana
   superior; sin ventanas, regresa a Porciones; en Porciones, sale de la app.
   ===================================================================== */
const TAB_KEY = 'minutriapp_activeTab';
const TAB_KEYS = ['porciones', 'recordatorio', 'recetas', 'progreso', 'perfil'];
const NAV = { stack: [], toGo: 0, sched: false, pending: 0, queue: 0, timer: null, onBase: null };
function navFlush() {
  NAV.pending = 0; clearTimeout(NAV.timer);
  while (NAV.queue > 0) { NAV.queue--; history.pushState({ mna: 1 }, ''); }
}
function navPush() {
  if (NAV.sched || NAV.pending) { NAV.queue++; return; }   // espera a que termine un "atrás" en curso
  try { history.pushState({ mna: 1 }, ''); } catch (e) { /* entorno sin historial */ }
}
function navBack() {
  if (NAV.queue > 0) { NAV.queue--; return; }              // anula una entrada que aún no se creó
  NAV.toGo++;
  if (NAV.sched) return;
  NAV.sched = true;
  Promise.resolve().then(() => {
    NAV.sched = false;
    const n = NAV.toGo; NAV.toGo = 0;
    if (!n) return navFlush();
    NAV.pending++;
    clearTimeout(NAV.timer); NAV.timer = setTimeout(navFlush, 800); // por si el navegador no emite popstate
    history.go(-n);
  });
}
window.addEventListener('popstate', () => {
  if (NAV.pending) { NAV.pending--; if (!NAV.pending) navFlush(); return; } // atrás provocado por la app
  const top = NAV.stack.pop();
  if (top) { top.popped = true; top.close(); return; }
  if (NAV.onBase) NAV.onBase();
});
/* Registra una ventana: "Atrás" la cierra; si se cierra con su botón, se retira su entrada */
function useBackClose(onClose) {
  const ref = useRef(onClose); ref.current = onClose;
  useEffect(() => {
    const entry = { close: () => ref.current && ref.current(), popped: false };
    NAV.stack.push(entry); navPush();
    return () => {
      const i = NAV.stack.indexOf(entry);
      if (i >= 0) { NAV.stack.splice(i, 1); if (!entry.popped) navBack(); }
    };
  }, []);
}
function loadTab() {
  try { const t = localStorage.getItem(TAB_KEY); return TAB_KEYS.includes(t) ? t : 'porciones'; } catch (e) { return 'porciones'; }
}

const DLG = { push: null };

function Dialogo({ d, onDone }) {

        ) : d.peligro ? (
          <div className="grid grid-cols-2 gap-2 mt-5">

            <button ref={cancelRef} onClick={() => finish(false)} className={cls(strong, 'bg-emerald-600 text-white')}>{d.textoCancelar}</button>
          </div>
        ) : (
          <div className="grid grid-cols-2 gap-2 mt-5">

        )}
      </div>
    </div>
  );

function DialogHost() {
  const [queue, setQueue] = useState([]);

/* =====================================================================
   SERVICE WORKER: instalación offline y aviso "Hay una versión nueva"
   ===================================================================== */
const APP_VERSION = 'v' + (self.MINUTRI_VERSION || '1.2.0');
const SWU = { reg: null, waiting: null, listeners: new Set(), userAsked: false };
const swNotify = () => SWU.listeners.forEach((f) => f(!!SWU.waiting));

  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then((reg) => {
    SWU.reg = reg;
    const track = (w) => {
      if (!w) return;
      const check = () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { SWU.waiting = w; swNotify(); } };
      check(); w.addEventListener('statechange', check);
    };
    track(reg.waiting); track(reg.installing);
    reg.addEventListener('updatefound', () => track(reg.installing));
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (SWU.userAsked) { SWU.userAsked = false; location.reload(); }   // recarga solo si el usuario tocó "Actualizar"
  });
}

  SWU.userAsked = true;
  SWU.waiting.postMessage({ type: 'SKIP_WAITING' });
}
function useUpdateReady() {
  const [ready, setReady] = useState(!!SWU.waiting);
  useEffect(() => { SWU.listeners.add(setReady); return () => SWU.listeners.delete(setReady); }, []);
  return ready;
}

function fmtBytes(b) { if (!b && b !== 0) return '—'; if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB'; return (b / 1024 / 1024).toFixed(1) + ' MB'; }

    const haveK = keys.filter((k) => !bad.includes(k));
    if (bad.length) say(`⚠️ Ojo: **${bad.map((k) => ING_BY[k].n).join(', ')}** está en tus alergias; no lo usaré en las sugerencias.`);
    const ranked = rankByIngredients(haveK, allRecipes(state).filter(okRecipe), remArm, lex);

  if (has(/ (falta|faltan|queda|quedan|restante|restan|saldo|llevo|sobra|sobran|resumen|como voy|cuanto me) /)) {

    const neg = GROUPS.filter((g) => rem[g.k] < -0.01);
    const water = day.water || 0;
    const used = KEYS.reduce((s, k) => s + G[k].kcal * (dayTotals(day)[k] || 0), 0);
    const L = [];
    if (pos.length) { L.push(`**Hoy te falta comer${nombre ? ',' + nombre : ''}:**`); pos.forEach((g) => L.push(`• ${fmtEq(rem[g.k])} ${g.name}`)); }

    if (neg.length) L.push(`Te pasaste en: ${neg.map((g) => `+${fmtEq(-rem[g.k])} ${g.short}`).join(', ')}.`);
    L.push(`💧 Agua: ${water} de ${waterGoal} vasos${water < waterGoal ? ` (te faltan ${waterGoal - water})` : ' ✅'}.`);
    L.push(`🔥 Energía: ${Math.round(used)} de ${eqKcal(targets)} kcal.`);
    const ideas = pos.slice(0, 3).map((g) => {
      const names = (SUGGEST_FOODS[g.k] || []).map((n) => lex.findFood(n)).filter((f) => f && !(() => { const fl = flagsFor(foodText(f), profile, lex); return fl.alerg.length || fl.disg.length; })()).slice(0, 3);

  }

  if (parsed.items.length) {

    if (!ate && has(/ (cuanto|cuanta|cuantas|cuantos|equivale|equivalen|caloria|calorias|kcal|grupo|medida|que es|informacion|info|macro|macros|proteina|porcion de|busca|buscar) /)) {

function resizeImage(file, fit, S = 160) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = S; c.height = S;
      const x = c.getContext('2d');
      x.fillStyle = '#ecfdf5'; x.fillRect(0, 0, S, S);
      const r = fit === 'contain' ? Math.min(S / img.width, S / img.height) : Math.max(S / img.width, S / img.height);
      const w = img.width * r, h = img.height * r;
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen')); };
    img.src = url;
  });
}

function parseMedida(m) {
  const toks = numberize(rawTokens(m));
  const q = toks.find(isNum); const unit = toks.map((t) => UNITS[t]).find(Boolean);
  const qty = q ? +q : 1; const out = {};
  if (unit && ['taza', 'cda', 'cdita', 'lata', 'rebanada'].includes(unit)) out.u = { [unit]: 1 / qty };
  else if (unit === 'g') out.g = qty;
  else if (qty !== 1) out.pz = qty;
  return out;
}

function useViewport() {

  const [vp, setVp] = useState(get);
  useEffect(() => {
    const v = window.visualViewport; const upd = () => setVp(get());
    if (v) { v.addEventListener('resize', upd); v.addEventListener('scroll', upd); }
    window.addEventListener('resize', upd);
    return () => { if (v) { v.removeEventListener('resize', upd); v.removeEventListener('scroll', upd); } window.removeEventListener('resize', upd); };
  }, []);
  return vp;
}

function NutriBot({ ctx, chat, setChat, onClose, onAvatar }) {

  useEffect(() => { const el = listRef.current; if (el) setTimeout(() => { el.scrollTop = el.scrollHeight; }, 30); }, [chat.msgs.length, vp.height]);
  const push = (arr) => setChat((c) => ({ ...c, msgs: [...c.msgs, ...arr.map((x) => ({ id: uid(), from: 'bot', ...x }))] }));
  const update = (id, patch) => setChat((c) => ({ ...c, msgs: c.msgs.map((x) => (x.id === id ? { ...x, data: { ...x.data, ...patch } } : x)) }));
  const send = (txt) => {
    const tx = String(txt == null ? input : txt).trim(); if (!tx) return;
    setInput('');
    const r = botReply(tx, { state, targets, waterGoal, lex, pending: chat.pending });
    setChat((c) => ({ pending: r.pending, msgs: [...c.msgs, { id: uid(), from: 'me', type: 'text', text: tx }, ...r.msgs.map((x) => ({ id: uid(), from: 'bot', ...x }))] }));
  };
  const register = (eq, mealK, water) => mutate((n) => {
    const dk = dateKey();
    const d = n.logs[dk] || (n.logs[dk] = { portions: {}, water: 0, recall: [] });
    const mm = d.portions[mealK] || (d.portions[mealK] = {});
    Object.entries(eq || {}).forEach(([k, v]) => { mm[k] = Math.round(((mm[k] || 0) + v) * 2) / 2; });
    d.water = (d.water || 0) + (water || 0);
  });
  const api = { state, lex, push, update, send, register, mutate, toast };

              onFocus={() => setTimeout(() => { const el = listRef.current; if (el) el.scrollTop = el.scrollHeight; }, 300)} aria-label="Mensaje para NutriBot" />

function applyTheme(mode) {
  const dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', !!dark);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#064e3b' : '#059669');
  try { localStorage.setItem('minutriapp_theme', mode); } catch (e) { /* privado */ }
}

function defaultMeal() {
  const h = new Date().getHours();
  return h < 10 ? 'des' : h < 12 ? 'col1' : h < 16 ? 'com' : h < 19 ? 'col2' : 'cen';
}
function PortionsScreen({ ctx }) {
  const { state, mutate, date, setDate, targets, provisional, openGuide, backupDue, doBackup, startOwn, go, waterGoal } = ctx;
  const [step, setStep] = useState(1);
  const [openMeal, setOpenMeal] = useState(defaultMeal());
  const day = state.logs[date] || { portions: {}, water: 0, recall: [] };
  const totals = useMemo(() => dayTotals(day), [day]);
  const kcalUsed = Math.round(KEYS.reduce((s, k) => s + G[k].kcal * totals[k], 0));
  const kcalGoal = eqKcal(targets);
  const bump = (meal, key, delta) => mutate((n) => {
    const d = n.logs[date] || (n.logs[date] = { portions: {}, water: 0, recall: [] });
    const m = d.portions[meal] || (d.portions[meal] = {});
    const v = Math.max(0, Math.round(((m[key] || 0) + delta) * 2) / 2);
    if (v === 0) delete m[key]; else m[key] = v;
  });
  const setWater = (v) => mutate((n) => {
    const d = n.logs[date] || (n.logs[date] = { portions: {}, water: 0, recall: [] });
    d.water = Math.max(0, v);
  });
  const water = day.water || 0;
  const glasses = Math.max(waterGoal, water, 8);
  return (
    <div>
      <ScreenHeader title="Porciones del día" subtitle={`${kcalUsed} de ${kcalGoal} kcal por equivalentes`}>
        <DateNav date={date} setDate={setDate} />
      </ScreenHeader>
      <div className="px-4 py-4 space-y-4">
        {state.meta.isSample && (
          <div className="rounded-2xl bg-amber-50 border border-amber-200 p-4">
            <div className="flex gap-3 items-start">
              <Icon name="Info" className="text-amber-600 shrink-0 mt-0.5" />
              <div className="flex-1">
                <p className="font-bold text-amber-900 text-sm">Estás viendo datos de ejemplo</p>
                <p className="text-xs text-amber-800 mt-0.5">Explora la app con información genérica. Cuando quieras, empieza con tus propios datos.</p>
                <button onClick={startOwn} className="mt-3 min-h-[48px] w-full rounded-xl bg-amber-500 text-white font-bold btn-press">Empezar con mis datos</button>
              </div>
            </div>
          </div>
        )}

          <button onClick={doBackup} className="w-full text-left rounded-2xl bg-emerald-50 border border-emerald-200 p-3 flex gap-3 items-center btn-press">
            <span className="w-11 h-11 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0"><Icon name="Share2" /></span>
            <span className="flex-1">
              <span className="block font-bold text-emerald-900 text-sm">Respaldo diario listo para guardar en Drive</span>
              <span className="block text-xs text-emerald-700">Toca y elige Google Drive · último: {sinceText(state.meta.lastBackup)}</span>
            </span>
            <Icon name="ChevronRight" className="text-emerald-600" />
          </button>
        )}
        {provisional && !state.meta.isSample && (
          <button onClick={() => go('perfil')} className="w-full text-left rounded-2xl bg-sky-50 border border-sky-200 p-3 text-sm text-sky-900 btn-press">
            <b>Completa tu perfil</b> para calcular tus metas personalizadas. Mientras tanto se usa un plan de 1,800 kcal de referencia.
          </button>
        )}

        <Card>
          <div className="flex items-center justify-between mb-3">
            <h2 className="font-bold text-emerald-900">Mi meta de hoy</h2>
            <button onClick={() => openGuide(null)} className="flex items-center gap-1.5 text-sm font-semibold text-emerald-700 min-h-[44px] px-2 btn-press"><Icon name="BookOpen" size={18} /> Guía de bolsillo</button>
          </div>
          <div className="space-y-3.5">
            {GROUPS.map((g) => {
              const used = totals[g.k] || 0, goal = targets[g.k] || 0, left = goal - used;
              if (g.opt && !goal && !used) return null;
              const pct = goal > 0 ? Math.min(100, (used / goal) * 100) : used > 0 ? 100 : 0;
              const over = used > goal;
              return (
                <div key={g.k}>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="w-7 h-7 rounded-lg flex items-center justify-center text-white shrink-0" style={{ background: g.color }}><Icon name={g.icon} size={15} /></span>
                    <span className="flex-1 text-sm font-semibold leading-tight">{g.name}</span>
                    <span className={cls('text-xs font-bold', over ? 'text-amber-600' : left === 0 && goal > 0 ? 'text-emerald-600' : 'text-gray-500')}>
                      {over ? `+${fmtEq(used - goal)} de más` : goal > 0 && left === 0 ? '¡Completo!' : `Quedan ${fmtEq(left)}`}
                    </span>
                    <button onClick={() => openGuide(g.k)} aria-label={`Guía de ${g.name}`} className="w-9 h-9 rounded-full flex items-center justify-center text-emerald-700 bg-emerald-50 btn-press"><Icon name="HelpCircle" size={18} /></button>
                  </div>
                  <div className="h-3 rounded-full bg-gray-100 overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-300" style={{ width: pct + '%', background: over ? '#d97706' : g.color }} />
                  </div>
                  <div className="text-[11px] text-gray-400 mt-0.5 text-right">{fmtEq(used)} / {fmtEq(goal)} equivalentes</div>
                </div>
              );
            })}
          </div>
        </Card>

        <Card>
          <div className="flex items-center justify-between">
            <div>
              <h2 className="font-bold text-emerald-900 flex items-center gap-2"><Icon name="Droplets" className="text-sky-500" /> Hidratación</h2>
              <p className="text-xs text-gray-500">{water} de {waterGoal} vasos · {(water * GLASS_ML / 1000).toFixed(2)} L de {(waterGoal * GLASS_ML / 1000).toFixed(2)} L</p>
            </div>
            <Stepper value={water} onDec={() => setWater(water - 1)} onInc={() => setWater(water + 1)} color="#0ea5e9" small />
          </div>
          <div className="grid grid-cols-8 gap-1.5 mt-3">
            {Array.from({ length: glasses }).map((_, i) => (
              <button key={i} onClick={() => setWater(water === i + 1 ? i : i + 1)} aria-label={`Vaso ${i + 1}`}
                className={cls('h-11 rounded-lg flex items-center justify-center btn-press', i < water ? 'bg-sky-500 text-white' : 'bg-sky-50 text-sky-300', i + 1 === waterGoal && 'ring-2 ring-sky-300')}>
                <Icon name="GlassWater" size={18} />
              </button>
            ))}
          </div>
          <p className="text-[11px] text-gray-400 mt-2">Meta: 35 ml por kg de peso ({num(state.profile.peso) || 70} kg) en vasos de {GLASS_ML} ml.</p>
        </Card>

        <div>
          <div className="flex items-center justify-between mb-2 px-1">
            <h2 className="font-bold text-emerald-900">Registrar por tiempo de comida</h2>
            <div className="flex items-center gap-1 text-xs">
              <span className="text-gray-500">Paso</span>
              {[1, 0.5].map((s) => (
                <button key={s} onClick={() => setStep(s)} className={cls('min-w-[44px] min-h-[36px] rounded-lg font-bold', step === s ? 'bg-emerald-600 text-white' : 'bg-white border border-emerald-200 text-emerald-700')}>{s === 1 ? '1' : '½'}</button>
              ))}
            </div>
          </div>
          <div className="space-y-2.5">
            {MEALS.map((m) => {
              const items = day.portions[m.k] || {};
              const chips = KEYS.filter((k) => items[k] > 0);
              const isOpen = openMeal === m.k;
              return (
                <div key={m.k} className="bg-white rounded-2xl border border-emerald-100 shadow-sm overflow-hidden">
                  <button onClick={() => setOpenMeal(isOpen ? null : m.k)} className="w-full flex items-center gap-3 p-3.5 min-h-[60px] text-left">
                    <span className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0"><Icon name={m.icon} /></span>

                      <span className="block font-bold">{m.n}</span>
                      <span className="block text-xs text-gray-500 truncate">{chips.length ? chips.map((k) => `${fmtEq(items[k])} ${G[k].short}`).join(' · ') : 'Sin registrar'}</span>

                    <Icon name="ChevronDown" className={cls('text-gray-400 transition-transform', isOpen && 'rotate-180')} />
                  </button>

                    <div className="px-3.5 pb-3.5 divide-y divide-gray-100">
                      {GROUPS.map((g) => (
                        <div key={g.k} className="flex items-center gap-2 py-2">
                          <span className="w-2.5 h-8 rounded-full shrink-0" style={{ background: g.color }} />

                          <button onClick={() => openGuide(g.k)} aria-label={`Guía de ${g.name}`} className="w-9 h-9 rounded-full flex items-center justify-center text-emerald-700 bg-emerald-50"><Icon name="HelpCircle" size={17} /></button>
                          <Stepper value={items[g.k] || 0} color={g.color} onDec={() => bump(m.k, g.k, -step)} onInc={() => bump(m.k, g.k, step)} small />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   RECORDATORIO DE 24 HORAS
   --------------------------------------------------------------------- */
const HAMBRE = [
  { v: 1, e: '😫', t: 'Mucha hambre' }, { v: 2, e: '🙁', t: 'Algo de hambre' }, { v: 3, e: '😐', t: 'Neutral' },
  { v: 4, e: '🙂', t: 'Satisfecho' }, { v: 5, e: '😌', t: 'Muy lleno' }
];
function buildSummary(state, date, targets) {
  const day = state.logs[date] || { portions: {}, recall: [], water: 0 };
  const L = [];
  L.push('*Recordatorio de 24 horas*');
  L.push(`Fecha: ${fmtLong(date)}`);
  if (state.profile.nombre) L.push(`Nombre: ${state.profile.nombre}`);
  if (state.profile.peso) L.push(`Peso actual: ${state.profile.peso} kg`);
  L.push('');
  MEALS.forEach((m) => {
    const es = (day.recall || []).filter((e) => e.meal === m.k).sort((a, b) => a.hora.localeCompare(b.hora));
    if (!es.length) return;
    L.push(`*${m.n}*`);
    es.forEach((e) => { const h = HAMBRE.find((x) => x.v === e.hambre); L.push(`• ${e.hora} – ${e.texto}${h ? ` (hambre/saciedad ${e.hambre}/5: ${h.t.toLowerCase()})` : ''}`); });
    L.push('');
  });
  if (!(day.recall || []).length) { L.push('(Sin alimentos anotados)'); L.push(''); }
  const t = dayTotals(day);
  const rows = GROUPS.filter((g) => t[g.k] > 0 || targets[g.k] > 0).map((g) => `${g.short}: ${fmtEq(t[g.k])}/${fmtEq(targets[g.k] || 0)}`);
  L.push('*Equivalentes consumidos / meta*');
  L.push(rows.join(' | '));
  L.push('');
  L.push(`*Agua:* ${day.water || 0} vasos (${(day.water || 0) * GLASS_ML} ml)`);
  return L.join('\n');
}

  const fits = any ? scored.filter((x) => x.over === 0) : scored;

function LineChart({ points, unit, color }) {
  if (!points.length) return <p className="text-center text-sm text-gray-400 py-10">Sin datos para graficar.</p>;
  const W = 320, H = 200, pl = 38, pr = 14, pt = 16, pb = 30;
  const ys = points.map((p) => p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  const padY = (max - min || 1) * 0.2; min -= padY; max += padY;
  const ts = points.map((p) => parseKey(p.x).getTime());
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const X = (t) => (t1 === t0 ? (pl + W - pr) / 2 : pl + ((t - t0) / (t1 - t0)) * (W - pl - pr));
  const Y = (v) => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${X(ts[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area = `${path} L${X(ts[ts.length - 1]).toFixed(1)},${H - pb} L${X(ts[0]).toFixed(1)},${H - pb} Z`;
  const ticks = [0, 1, 2, 3].map((i) => min + ((max - min) * i) / 3);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="Gráfica de evolución">
      {ticks.map((v, i) => (
        <g key={i}>
          <line x1={pl} x2={W - pr} y1={Y(v)} y2={Y(v)} stroke="#94a3b8" strokeOpacity="0.35" strokeDasharray="3 3" />
          <text x={pl - 5} y={Y(v) + 3} fontSize="9" textAnchor="end" fill="#9ca3af">{v.toFixed(1)}</text>
        </g>
      ))}
      <path d={area} fill={color} opacity="0.12" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={X(ts[i])} cy={Y(p.y)} r="4" fill="#fff" stroke={color} strokeWidth="2" />
          {(i === points.length - 1 || i === 0 || points.length <= 6) && (
            <text x={X(ts[i])} y={Y(p.y) - 8} fontSize="9" fontWeight="700" textAnchor="middle" fill={color}>{p.y}</text>
          )}
        </g>
      ))}
      <text x={X(ts[0])} y={H - 10} fontSize="9" textAnchor={points.length > 1 ? 'start' : 'middle'} fill="#6b7280">{fmtShort(points[0].x)}</text>
      {points.length > 1 && <text x={X(ts[ts.length - 1])} y={H - 10} fontSize="9" textAnchor="end" fill="#6b7280">{fmtShort(points[points.length - 1].x)}</text>}
      <text x={W - pr} y={10} fontSize="9" textAnchor="end" fill="#9ca3af">{unit}</text>
    </svg>
  );
}
function ProgressScreen({ ctx }) {
  const { state, mutate, toast } = ctx;
  const [f, setF] = useState({ fecha: dateKey(), peso: '', cintura: '', cadera: '' });
  const [metric, setMetric] = useState('peso');
  const sexo = state.profile.sexo;
  const rows = useMemo(() => [...state.progress].sort((a, b) => a.fecha.localeCompare(b.fecha)).map((r) => ({ ...r, icc: r.cintura > 0 && r.cadera > 0 ? r.cintura / r.cadera : null })), [state.progress]);
  const save = () => {
    const peso = num(f.peso), cintura = num(f.cintura), cadera = num(f.cadera);
    if (!(peso > 0 || cintura > 0 || cadera > 0)) { toast('Captura al menos una medida'); return; }
    mutate((n) => {
      let e = n.progress.find((x) => x.fecha === f.fecha);
      if (!e) { e = { id: uid(), fecha: f.fecha }; n.progress.push(e); }
      if (peso > 0) e.peso = peso; if (cintura > 0) e.cintura = cintura; if (cadera > 0) e.cadera = cadera;
      const conPeso = n.progress.filter((x) => x.peso > 0).sort((a, b) => a.fecha.localeCompare(b.fecha));
      if (conPeso.length) n.profile.peso = conPeso[conPeso.length - 1].peso;
    });
    setF({ fecha: dateKey(), peso: '', cintura: '', cadera: '' }); toast('Medidas guardadas ✓');
  };
  const del = async (id) => {
    const r = state.progress.find((x) => x.id === id); if (!r) return;
    const det = [r.peso ? `${r.peso} kg` : '', r.cintura ? `cintura ${r.cintura} cm` : '', r.cadera ? `cadera ${r.cadera} cm` : ''].filter(Boolean).join(', ');
    if (await mostrarDialogo({ mensaje: `Se eliminará el registro del ${fmtLong(r.fecha)}${det ? ` (${det})` : ''} de tu historial y de la gráfica.`, textoConfirmar: 'Eliminar', peligro: true })) mutate((n) => { n.progress = n.progress.filter((x) => x.id !== id); });
  };
  const M = { peso: { t: 'Peso', u: 'kg', c: '#059669' }, cintura: { t: 'Cintura', u: 'cm', c: '#ea580c' }, cadera: { t: 'Cadera', u: 'cm', c: '#7c3aed' }, icc: { t: 'ICC', u: 'índice', c: '#0284c7' } };
  const pts = rows.filter((r) => r[metric] > 0 && r[metric] != null).map((r) => ({ x: r.fecha, y: metric === 'icc' ? Math.round(r.icc * 100) / 100 : r[metric] }));
  const first = pts[0], last = pts[pts.length - 1];
  const delta = first && last ? r1(last.y - first.y) : 0;
  const lastIcc = [...rows].reverse().find((r) => r.icc);
  return (
    <div>
      <ScreenHeader title="Mi progreso" subtitle="Peso, cintura, cadera e índice cintura-cadera" />
      <div className="px-4 py-4 space-y-4">
        <Card>
          <h2 className="font-bold text-emerald-900 mb-3">Nuevo registro</h2>
          <div className="grid grid-cols-2 gap-3">
            <div className="col-span-2"><Field label="Fecha"><input type="date" value={f.fecha} max={dateKey()} onChange={(e) => setF({ ...f, fecha: e.target.value })} className={inputCls} /></Field></div>
            <Field label="Peso (kg)"><input inputMode="decimal" value={f.peso} onChange={(e) => setF({ ...f, peso: e.target.value })} placeholder="68.0" className={inputCls} /></Field>
            <Field label="Cintura (cm)"><input inputMode="decimal" value={f.cintura} onChange={(e) => setF({ ...f, cintura: e.target.value })} placeholder="80" className={inputCls} /></Field>
            <Field label="Cadera (cm)"><input inputMode="decimal" value={f.cadera} onChange={(e) => setF({ ...f, cadera: e.target.value })} placeholder="98" className={inputCls} /></Field>
            <div className="flex items-end"><button onClick={save} className="w-full min-h-[48px] rounded-xl bg-emerald-600 text-white font-bold btn-press flex items-center justify-center gap-2"><Icon name="Save" size={18} /> Guardar</button></div>
          </div>
        </Card>
        <Card>
          <div className="flex gap-1.5 mb-3 overflow-x-auto">
            {Object.entries(M).map(([k, m]) => (
              <button key={k} onClick={() => setMetric(k)} className={cls('shrink-0 min-h-[44px] px-4 rounded-full text-sm font-semibold btn-press', metric === k ? 'text-white' : 'bg-gray-100 text-gray-600')} style={metric === k ? { background: m.c } : {}}>{m.t}</button>
            ))}
          </div>
          <LineChart points={pts} unit={M[metric].u} color={M[metric].c} />
          {first && last && pts.length > 1 && (
            <div className="grid grid-cols-3 gap-2 mt-3 text-center">
              <div className="rounded-xl bg-gray-50 p-2"><div className="text-[11px] text-gray-500">Inicial</div><div className="font-bold">{first.y}</div></div>
              <div className="rounded-xl bg-gray-50 p-2"><div className="text-[11px] text-gray-500">Actual</div><div className="font-bold">{last.y}</div></div>
              <div className="rounded-xl p-2" style={{ background: M[metric].c + '18' }}><div className="text-[11px] text-gray-500">Cambio</div><div className="font-bold" style={{ color: M[metric].c }}>{delta > 0 ? '+' : ''}{metric === 'icc' ? (last.y - first.y).toFixed(2) : delta}</div></div>
            </div>
          )}
          {lastIcc && (
            <div className="mt-3 rounded-xl bg-gray-50 p-3 text-sm flex items-center justify-between gap-2">
              <span>ICC más reciente: <b>{lastIcc.icc.toFixed(2)}</b></span>
              <span className={cls('text-xs font-bold rounded-full px-2.5 py-1', iccClass(lastIcc.icc, sexo).c)}>{iccClass(lastIcc.icc, sexo).t}</span>
            </div>
          )}
        </Card>
        <Card>
          <h2 className="font-bold text-emerald-900 mb-2">Historial</h2>
          {rows.length === 0 && <p className="text-sm text-gray-400">Sin registros todavía.</p>}
          <ul className="divide-y divide-gray-100">
            {[...rows].reverse().map((r) => (
              <li key={r.id} className="flex items-center gap-2 py-2.5">
                <div className="flex-1">
                  <div className="text-sm font-bold capitalize">{parseKey(r.fecha).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
                  <div className="text-xs text-gray-600">
                    {r.peso ? `${r.peso} kg` : ''}{r.cintura ? ` · Cintura ${r.cintura} cm` : ''}{r.cadera ? ` · Cadera ${r.cadera} cm` : ''}{r.icc ? ` · ICC ${r.icc.toFixed(2)}` : ''}
                  </div>
                </div>
                <button onClick={() => del(r.id)} aria-label="Eliminar" className="w-11 h-11 rounded-full flex items-center justify-center text-red-400 active:bg-red-50"><Icon name="Trash2" size={18} /></button>
              </li>
            ))}
          </ul>
        </Card>
      </div>
    </div>
  );
}

              <Field label="Talla (cm)"><input inputMode="decimal" value={p.talla} onChange={(e) => set('talla', e.target.value)} className={inputCls} /></Field>
            </div>
            <Field label="Nivel de actividad física">
              <select value={p.actividad} onChange={(e) => set('actividad', e.target.value)} className={inputCls}>
                {Object.entries(ACT).map(([k, a]) => <option key={k} value={k}>{a.n}</option>)}
              </select>
            </Field>
            <Field label="Objetivo">
              <Segmented value={p.objetivo} onChange={(v) => set('objetivo', v)} options={Object.entries(OBJ).map(([k, o]) => ({ v: k, t: o.n.split(' ')[0] }))} />

        </Card>

        <Card>
          <h2 className="font-bold text-emerald-900 mb-3">Mi evaluación</h2>
          {!metrics ? <p className="text-sm text-gray-500">Captura edad, peso y talla para calcular tu IMC, TMB y GET.</p> : (
            <div className="grid grid-cols-2 gap-2.5">
              <div className="rounded-xl bg-emerald-50 p-3 col-span-2">
                <div className="text-xs text-gray-500">Índice de masa corporal (IMC)</div>

              </div>
              <div className="rounded-xl bg-gray-50 p-3"><div className="text-xs text-gray-500">TMB (Mifflin-St Jeor)</div><div className="text-xl font-extrabold">{Math.round(metrics.tmb)} <span className="text-xs font-semibold text-gray-500">kcal</span></div></div>

        </Card>

        <Card>

          <div className="space-y-3">

              <div className="flex justify-between text-sm font-semibold"><span>Carbohidratos</span><span>{p.pc} %</span></div>
              <input type="range" min="40" max="65" step="1" value={p.pc} onChange={(e) => mutate((n) => { n.profile.pc = +e.target.value; n.profile.manualEq = null; })} />

            <div>
              <div className="flex justify-between text-sm font-semibold"><span>Proteínas</span><span>{p.pp} %</span></div>
              <input type="range" min="10" max="35" step="1" value={p.pp} onChange={(e) => mutate((n) => { n.profile.pp = +e.target.value; n.profile.manualEq = null; })} />
            </div>
            <div className="flex justify-between text-sm font-semibold"><span>Grasas (automático)</span><span className={fat < 20 || fat > 35 ? 'text-amber-600' : ''}>{fat} %</span></div>
            {(fat < 20 || fat > 35) && <p className="text-xs text-amber-600">Lo habitual es 20-35 % de grasas. Ajusta carbohidratos o proteínas.</p>}
            {metrics && <p className="text-xs text-gray-500">Meta en gramos: HC {Math.round(metrics.meta * p.pc / 400)} g · P {Math.round(metrics.meta * p.pp / 400)} g · L {Math.round(metrics.meta * fat / 900)} g</p>}
          </div>
        </Card>

        <Card>
          <div className="flex items-center justify-between mb-1">

          </div>
          <p className="text-xs text-gray-500 mb-2">Total: <b>{kc} kcal</b> · HC {mac.c} g · P {mac.p} g · L {mac.l} g. Si tu nutriólogo te dio otro plan, ajústalo aquí.</p>
          <div className="divide-y divide-gray-100">
            {GROUPS.map((g) => (
              <div key={g.k} className="flex items-center gap-2 py-2">
                <span className="w-2.5 h-8 rounded-full" style={{ background: g.color }} />
                <span className="flex-1 text-sm font-semibold leading-tight">{g.name}</span>
                <Stepper value={targets[g.k] || 0} color={g.color} small onDec={() => editEq(g.k, -0.5)} onInc={() => editEq(g.k, 0.5)} />
              </div>
            ))}
          </div>
          {p.manualEq && <button onClick={() => set('manualEq', null)} className="mt-3 w-full min-h-[48px] rounded-xl border-2 border-emerald-600 text-emerald-700 font-bold btn-press flex items-center justify-center gap-2"><Icon name="RefreshCw" size={18} /> Volver al cálculo automático</button>}

        <Card>

          <p className="text-xs text-gray-500 mb-3">Último respaldo externo: <b>{sinceText(state.meta.lastBackup)}</b>. Se abre el menú de compartir de tu teléfono: elige <b>Drive</b> y guarda el archivo.</p>
          <button onClick={doBackup} className="w-full min-h-[56px] rounded-xl bg-emerald-600 text-white font-bold text-base btn-press flex items-center justify-center gap-2"><Icon name="Share2" /> Guardar respaldo en Drive</button>
          <button onClick={() => fileRef.current && fileRef.current.click()} className="mt-2 w-full min-h-[52px] rounded-xl border-2 border-emerald-600 text-emerald-700 font-bold btn-press flex items-center justify-center gap-2"><Icon name="Upload" size={18} /> Restaurar desde archivo (.json)</button>
          <input ref={fileRef} type="file" accept=".json,application/json,text/plain" className="hidden" onChange={onFile} />

                  <li key={c.date} className="flex items-center justify-between py-1.5">

                    <button onClick={() => restoreCopy(c)} className="min-h-[40px] px-3 rounded-lg bg-emerald-50 text-emerald-700 text-sm font-semibold btn-press">Restaurar</button>

          </div>
          <StorageGuard />
          <p className="text-xs text-gray-400 mt-3 flex gap-1.5"><Icon name="ShieldCheck" size={14} className="shrink-0" /> Privacidad total: tus datos viven solo en este dispositivo. Ningún dato se envía a servidores y el código no contiene claves ni credenciales.</p>
        </Card>

        <Card>
          <h2 className="font-bold text-emerald-900 mb-2">Datos de la app</h2>
          {state.meta.isSample && <p className="text-xs text-amber-700 bg-amber-50 rounded-lg p-2 mb-2">Ahora mismo ves datos de ejemplo.</p>}

        <p className="text-center text-[11px] text-gray-400 pb-2">Basada en el Sistema Mexicano de Alimentos Equivalentes (SMAE). Herramienta de apoyo personal; no sustituye la consulta con un profesional de la salud.</p>
      </div>
    </div>
  );
}

const TABS = [
  { k: 'porciones', n: 'Porciones', icon: 'ListChecks' },
  { k: 'recordatorio', n: '24 Horas', icon: 'Clock' },
  { k: 'recetas', n: 'Recetas', icon: 'ChefHat' },
  { k: 'progreso', n: 'Progreso', icon: 'TrendingUp' },
  { k: 'perfil', n: 'Perfil', icon: 'User' }
];
function App() {
  const [state, setState] = useState(loadState);
  const [tab, setTabRaw] = useState(loadTab);
  const tabRef = useRef(tab);
  /* Cambiar de pestaña: Porciones es la base; las demás ocupan una entrada del historial */
  const setTab = useCallback((t) => {
    const prev = tabRef.current;
    if (prev === t) return;
    if (prev === 'porciones') navPush();
    else if (t === 'porciones') navBack();
    tabRef.current = t; setTabRaw(t);
  }, []);
  useEffect(() => {
    // Al abrir la app: si se restauró otra pestaña, "Atrás" debe volver a Porciones
    const onEntry = !!(history.state && history.state.mna);
    if (tab !== 'porciones' && !onEntry) navPush();
    if (tab === 'porciones' && onEntry) navBack();
    NAV.onBase = () => { if (tabRef.current !== 'porciones') { tabRef.current = 'porciones'; setTabRaw('porciones'); } };
    return () => { NAV.onBase = null; };
  }, []);
  useEffect(() => { try { localStorage.setItem(TAB_KEY, tab); } catch (e) { /* privado */ } }, [tab]);
  const [date, setDate] = useState(dateKey());
  const [tour, setTour] = useState(false);
  const [botOpen, setBotOpen] = useState(false);
  const [avatarOpen, setAvatarOpen] = useState(false);
  const [chat, setChat] = useState({ msgs: [], pending: null });
  const theme = state.settings.theme;
  const cycleTheme = useCallback(() => setState((s) => { const n = clone(s); const order = ['light', 'dark', 'system']; n.settings.theme = order[(order.indexOf(n.settings.theme) + 1) % 3]; return n; }), []);
  const helpApi = useMemo(() => ({ open: () => setTour(true), theme, cycleTheme }), [theme]);
  useEffect(() => {
    applyTheme(theme);
    if (theme !== 'system' || !window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = () => applyTheme('system');
    mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); };
  }, [theme]);
  const [guide, setGuide] = useState(undefined); // undefined = cerrada, null = todas, 'key' = enfocada
  const [msg, setMsg] = useState('');
  const [copies, setCopies] = useState([]);
  const [now, setNow] = useState(Date.now());
  const toastT = useRef(null);

  const toast = useCallback((m) => { setMsg(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setMsg(''), 2400); }, []);
  const mutate = useCallback((fn) => setState((s) => { const n = clone(s); fn(n); n.meta.lastChange = Date.now(); return n; }), []);

  /* Persistencia: localStorage + copia diaria en IndexedDB */
  useEffect(() => {
    const t = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* cuota/privado */ } }, 250);
    return () => clearTimeout(t);
  }, [state]);
  const stateRef = useRef(state); stateRef.current = state;
  useEffect(() => {
    const flush = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(stateRef.current)); } catch (e) { /* cuota/privado */ } };
    const vis = () => { if (document.visibilityState === 'hidden') flush(); };
    window.addEventListener('pagehide', flush); document.addEventListener('visibilitychange', vis);
    return () => { window.removeEventListener('pagehide', flush); document.removeEventListener('visibilitychange', vis); };
  }, []);
  const refreshCopies = useCallback(() => { idb.all().then((r) => setCopies(r.sort((a, b) => b.date.localeCompare(a.date)))).catch(() => {}); }, []);
  useEffect(() => { refreshCopies(); }, []);
  useEffect(() => {
    const t = setTimeout(() => {
      idb.put({ date: dateKey(), savedAt: Date.now(), data: JSON.stringify(state) }).then(refreshCopies).catch(() => {});
    }, 2500);
    return () => clearTimeout(t);
  }, [state]);
  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 60000); return () => clearInterval(i); }, []);
  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  const metrics = useMemo(() => calcMetrics(state.profile), [state.profile]);
  const plan = useMemo(() => planEq(metrics ? metrics.meta : 1800, state.profile.pc, state.profile.pp), [metrics, state.profile.pc, state.profile.pp]);
  const targets = state.profile.manualEq || plan;
  const waterGoal = Math.max(1, Math.ceil(((num(state.profile.peso) || 70) * 35) / GLASS_ML));
  const last = state.meta.lastBackup;
  const lastChange = state.meta.lastChange;
  const backupDue = !state.meta.isSample && (!last || (now - last > 24 * 36e5 && (!lastChange || lastChange > last)));

  const doBackup = async () => {
    try {
      const r = await exportBackup(state);
      if (r === 'cancelled') return;
      setState((s) => { const n = clone(s); n.meta.lastBackup = Date.now(); return n; });
      toast(r === 'shared' ? 'Respaldo enviado ✓' : 'Respaldo descargado en tu dispositivo ✓');
    } catch (e) { toast('No se pudo generar el respaldo'); }
  };
  const startOwn = async () => {
    if (!(await mostrarDialogo({ mensaje: (state.meta.isSample ? 'Se borrarán los datos de ejemplo' : 'Se borrarán tus datos actuales: perfil, porciones, bitácora de 24 horas y progreso') + ' para empezar desde cero con tus propios datos.\n\nSe conservan tus recetas propias, alimentos enseñados al NutriBot, avatar y tema. Las copias internas de 7 días siguen disponibles.', textoConfirmar: 'Borrar y empezar', peligro: true }))) return;
    setState((s) => Object.assign(makeEmpty(), { settings: s.settings, custom: s.custom })); setTab('perfil'); toast('Listo. Captura tu perfil');
  };
  const loadSample = async () => { if (await mostrarDialogo({ mensaje: 'Se reemplazarán tus datos actuales (perfil, porciones, bitácora y progreso) por datos de ejemplo genéricos.\n\nSi quieres conservarlos, primero guarda un respaldo .json en Drive.', textoConfirmar: 'Cargar ejemplo', peligro: true })) { setState((s) => Object.assign(makeSample(), { settings: s.settings, custom: s.custom })); toast('Datos de ejemplo cargados'); } };

  const ctx = {
    state, mutate, setState, date, setDate, targets, plan, metrics, provisional: !metrics, waterGoal, backupDue, doBackup, startOwn, loadSample,
    copies, toast, go: setTab, openGuide: (k) => setGuide(k), openBot: () => setBotOpen(true)
  };
  return (
    <HelpCtx.Provider value={helpApi}>
    <div className="max-w-md mx-auto min-h-screen app-bg relative pb-44">
      {tab === 'porciones' && <PortionsScreen ctx={ctx} />}
      {tab === 'recordatorio' && <RecallScreen ctx={ctx} />}
      {tab === 'recetas' && <RecipesScreen ctx={ctx} />}
      {tab === 'progreso' && <ProgressScreen ctx={ctx} />}
      {tab === 'perfil' && <ProfileScreen ctx={ctx} />}
      {tour && <TourModal onClose={() => setTour(false)} onGo={(t) => { setTour(false); if (t === 'bot') setBotOpen(true); else setTab(t); }} />}
      {guide !== undefined && <GuideModal focus={guide} onClose={() => setGuide(undefined)} />}
      {!botOpen && (
        <div className="fixed inset-x-0 z-30 pointer-events-none" style={{ bottom: 'calc(env(safe-area-inset-bottom) + 76px)' }}>
          <div className="max-w-md mx-auto flex justify-end px-4">
            <button onClick={() => setBotOpen(true)} aria-label="Abrir NutriBot" className="pointer-events-auto relative w-14 h-14 rounded-full bg-emerald-100 shadow-lg ring-4 ring-white overflow-hidden btn-press flex items-center justify-center">
              <AvatarFace settings={state.settings} size={56} />
            </button>
          </div>
        </div>
      )}
      {botOpen && <NutriBot ctx={ctx} chat={chat} setChat={setChat} onClose={() => setBotOpen(false)} onAvatar={() => setAvatarOpen(true)} />}
      {avatarOpen && <Modal title="Elige a tu NutriBot" onClose={() => setAvatarOpen(false)}><AvatarPicker ctx={ctx} /></Modal>}
      <UpdateBanner />
      <DialogHost />
      {msg && <div className="fixed left-1/2 -translate-x-1/2 bottom-40 z-[60] bg-gray-900 text-white text-sm font-semibold rounded-full px-5 py-3 shadow-lg max-w-[90%] text-center">{msg}</div>}
      <nav className="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-emerald-100 shadow-[0_-4px_16px_rgba(5,150,105,.08)] safe-bottom">
        <div className="max-w-md mx-auto grid grid-cols-5">
          {TABS.map((t) => (
            <button key={t.k} onClick={() => setTab(t.k)} className={cls('flex flex-col items-center justify-center gap-0.5 min-h-[62px] btn-press', tab === t.k ? 'text-emerald-700' : 'text-gray-400')}>
              <span className={cls('px-4 py-1 rounded-full', tab === t.k && 'bg-emerald-100')}><Icon name={t.icon} size={22} sw={tab === t.k ? 2.5 : 2} /></span>
              <span className="text-[11px] font-bold">{t.n}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
    </HelpCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
